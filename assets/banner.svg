<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    .code-text { font-family: monospace; font-size: 13px; fill: #38bdf8; }

    /* Animated background elements */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 400; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }

    .bg-circle { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .float-card-1 { animation: float1 5s infinite ease-in-out; }
    .float-card-2 { animation: float2 6s infinite ease-in-out; }
    .pulse-line { stroke-dasharray: 200; animation: sweep 4s infinite linear; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Animated Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="350" fill="url(#grid)"/>
  </g>

  <!-- Dynamic Animated Ambient Glow Spheres (Background) -->
  <circle class="bg-circle" cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.2" filter="url(#glow)"/>
  <circle class="bg-circle" cx="1050" cy="270" r="140" fill="#8b5cf6" opacity="0.2" filter="url(#glow)"/>

  <!-- Decorative Circuit / Code Flow Lines in Background -->
  <path d="M 100 280 Q 250 320 400 280 T 700 290" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3" class="pulse-line"/>
  <path d="M 800 60 Q 950 20 1100 70" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.3" class="pulse-line"/>

  <!-- Side Floating Interactive/Gamified Metric Cards (Positioned safely away from title) -->
  <g class="float-card-1" transform="translate(60, 220)">
    <rect width="210" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
    <circle cx="35" cy="35" r="18" fill="#0284c7" opacity="0.3"/>
    <text x="35" y="41" text-anchor="middle" font-size="18">🏆</text>
    <text x="70" y="32" class="badge-text">Leaderboard</text>
    <text x="70" y="52" font-family="system-ui" font-size="12" fill="#38bdf8">Top 1% Bug Hunter</text>
  </g>

  <g class="float-card-2" transform="translate(930, 60)">
    <rect width="210" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
    <circle cx="35" cy="35" r="18" fill="#16a34a" opacity="0.3"/>
    <text x="35" y="41" text-anchor="middle" font-size="18">⚡</text>
    <text x="70" y="32" class="badge-text">Quality Gate</text>
    <text x="70" y="52" font-family="system-ui" font-size="12" fill="#4ade80">Passed • 0 Vulnerabilities</text>
  </g>

  <!-- FOREGROUND TEXT (Clear, Unobstructed Center Focus) -->
  <g text-anchor="middle">
    <!-- Icon Header -->
    <text x="600" y="105" font-size="42" filter="url(#glow)">🎮 🐛 🛡️ 🚀</text>

    <!-- Main Title -->
    <text x="600" y="165" class="title" filter="url(#glow)">Awesome Gamified Code Quality</text>

    <!-- Subtitle -->
    <text x="600" y="205" class="subtitle">&amp; Bug Fixing Ecosystem</text>

    <!-- Feature Pills / Tags (Centered below subtitle) -->
    <g transform="translate(300, 235)">
      <rect x="0" y="0" width="140" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="70" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#38bdf8" font-weight="600">Static Analysis</text>

      <rect x="150" y="0" width="140" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="220" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#a78bfa" font-weight="600">Bug Challenges</text>

      <rect x="300" y="0" width="140" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="370" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#f472b6" font-weight="600">Secure Coding</text>

      <rect x="450" y="0" width="150" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="525" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#4ade80" font-weight="600">Quality Gates</text>
    </g>
  </g>
</svg>
